# Raspberry Pi: runs the image built by GitHub Actions (no build on the Pi).
#   docker compose -f docker-compose.pi.yml pull
#   docker compose -f docker-compose.pi.yml up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: texbanner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: texbanner
      TZ: ${TZ:-Africa/Tunis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U texbanner"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Keeps PostgreSQL modest on a 4 GB Pi
    shm_size: 128mb

  app:
    image: ${IMAGE:?set IMAGE in .env, e.g. ghcr.io/<user>/texbanner-shop:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://texbanner:${POSTGRES_PASSWORD}@db:5432/texbanner
    ports:
      # Local network access (admin, testing): http://<pi-address>:3000
      # Public visitors come through the tunnel, not this port.
      - "3000:3000"
    volumes:
      - storage:/app/storage
    depends_on:
      db: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Publishes the shop on https://texbanner.com without opening any router port.
  # Create the tunnel in Cloudflare (Zero Trust → Networks → Tunnels), copy its token
  # into TUNNEL_TOKEN, and point the public hostname at the service http://app:3000.
  # Leave TUNNEL_TOKEN empty to run local-network-only: the container then just idles.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env, or comment out this service}
      TZ: ${TZ:-Africa/Tunis}
    depends_on:
      app: { condition: service_started }
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

volumes:
  pgdata:
  storage:
